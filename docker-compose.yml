services:
  rf-suite:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: rf-suite:latest
    container_name: rf-suite-env
    restart: unless-stopped
    shm_size: '2gb'
    stdin_open: true
    tty: true
    ports:
      # noVNC Browser GUI: Navigate to http://localhost:6080
      - "${WEB_PORT:-6080}:6080"
      # Direct VNC client access
      - "${VNC_PORT:-5900}:5900"
      # MCP Server / API access
      - "${MCP_PORT:-8000}:8000"
    volumes:
      # Project files mount (configure in .env or override via command line; defaults to parent directory)
      - "${PROJECT_PATH:-..}:/workspace"
      - ./entrypoint.sh:/opt/rf-suite-env/entrypoint.sh:ro
      # 3D Component Models for photorealistic KiCad rendering
      - "${KICAD_3DMODELS_PATH:-rf_suite_3dmodels}:/usr/share/kicad/3dmodels"
      # Persistent CAD & EDA user configurations
      - rf_suite_config:/root/.config
      - rf_suite_local:/root/.local
    environment:
      - DISPLAY=:99
      - RESOLUTION=${RESOLUTION:-1920x1080}
      - VNC_PASSWORD=${VNC_PASSWORD:-rfworkbench}
      - PYTHONPATH=/usr/lib/freecad-python3/lib:/opt/openEMS/share/openEMS/matlab:/opt/openEMS/share/CSXCAD/matlab:/opt/kicad-mcp-server/src:/root/.local/share/FreeCAD/Mod/freecad-microwave:/workspace
      - LD_LIBRARY_PATH=/opt/openEMS/lib:/usr/local/lib
      - KICAD6_3DMODEL_DIR=/usr/share/kicad/3dmodels
      - KICAD7_3DMODEL_DIR=/usr/share/kicad/3dmodels
      - KICAD8_SYMBOL_DIR=/usr/share/kicad/symbols
      - KICAD8_FOOTPRINT_DIR=/usr/share/kicad/footprints
      - KICAD8_3DMODEL_DIR=/usr/share/kicad/3dmodels
      - KICAD10_SYMBOL_DIR=/usr/share/kicad/symbols
      - KICAD10_FOOTPRINT_DIR=/usr/share/kicad/footprints
      - KICAD10_3DMODEL_DIR=/usr/share/kicad/3dmodels
    working_dir: /workspace

volumes:
  rf_suite_3dmodels:
    name: rf_suite_3dmodels
  rf_suite_config:
    name: rf_suite_config
  rf_suite_local:
    name: rf_suite_local
